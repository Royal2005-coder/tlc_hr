version: 1
kind: workflow
workflow:
  name: TLC Recruitment Requisition Approval
  doctype: Job Requisition
  send_email_alert: true
  states:
    - {state: Recruitment Draft, doc_status: 0, allow_edit: TLC Line Manager}
    - {state: Recruitment HR Review, doc_status: 0, allow_edit: TLC HR Lead}
    - {state: Recruitment CEO Review, doc_status: 0, allow_edit: TLC Director}
    - {state: Recruitment Approved, doc_status: 0, allow_edit: TLC HR Lead}
    - {state: Recruitment Rejected, doc_status: 0, allow_edit: TLC HR Lead, update_field: status, update_value: Rejected}
  transitions:
    - {from: Recruitment Draft, action: Submit Recruitment, to: Recruitment HR Review, allowed: [TLC Line Manager, TLC HR Lead, TLC HR Officer], allow_self_approval: true}
    - {from: Recruitment HR Review, action: Review Recruitment, to: Recruitment CEO Review, allowed: [TLC HR Lead]}
    - {from: Recruitment HR Review, action: Return Recruitment, to: Recruitment Draft, allowed: [TLC HR Lead]}
    - {from: Recruitment CEO Review, action: Approve Recruitment, to: Recruitment Approved, allowed: [TLC Director]}
    - {from: Recruitment CEO Review, action: Reject Recruitment, to: Recruitment Rejected, allowed: [TLC Director]}
