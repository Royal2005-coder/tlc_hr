version: 1
kind: workflow
description: PO 4.2 sequential authorization; document hooks independently enforce scope and no self approval.
workflow:
  name: TLC Travel Request
  doctype: Travel Request
  states:
  - {state: Nháp, doc_status: 0, allow_edit: TLC Self Service}
  - {state: Chờ quản lý duyệt, doc_status: 0, allow_edit: TLC Line Manager}
  - {state: Chờ giám đốc duyệt, doc_status: 0, allow_edit: TLC Director}
  - {state: Bổ sung thông tin, doc_status: 0, allow_edit: TLC Self Service}
  - {state: Từ chối, doc_status: 0, allow_edit: TLC Self Service}
  - {state: Đã duyệt, doc_status: 1, allow_edit: TLC Self Service}
  - {state: Bổ sung báo cáo, doc_status: 1, allow_edit: TLC Self Service}
  - {state: Chờ quản lý duyệt báo cáo, doc_status: 1, allow_edit: TLC Line Manager}
  - {state: Chờ giám đốc duyệt báo cáo, doc_status: 1, allow_edit: TLC Director}
  - {state: Hoàn tất, doc_status: 1, allow_edit: TLC Self Service}
  - {state: Đã hủy, doc_status: 2, allow_edit: TLC Self Service}
  transitions:
  - {from: Nháp, action: Gửi duyệt, to: Chờ quản lý duyệt, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: not doc.tlc_skip_manager}
  - {from: Nháp, action: Gửi giám đốc, to: Chờ giám đốc duyệt, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: doc.tlc_skip_manager}
  - {from: Bổ sung thông tin, action: Gửi duyệt, to: Chờ quản lý duyệt, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: not doc.tlc_skip_manager}
  - {from: Bổ sung thông tin, action: Gửi giám đốc, to: Chờ giám đốc duyệt, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: doc.tlc_skip_manager}
  - {from: Từ chối, action: Gửi duyệt, to: Chờ quản lý duyệt, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: not doc.tlc_skip_manager}
  - {from: Từ chối, action: Gửi giám đốc, to: Chờ giám đốc duyệt, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: doc.tlc_skip_manager}
  - {from: Chờ quản lý duyệt, action: Duyệt, to: Chờ giám đốc duyệt, allowed: [TLC Line Manager], allow_self_approval: true}
  - {from: Chờ quản lý duyệt, action: Trả lại, to: Bổ sung thông tin, allowed: [TLC Line Manager], allow_self_approval: true}
  - {from: Chờ quản lý duyệt, action: Từ chối, to: Từ chối, allowed: [TLC Line Manager], allow_self_approval: true}
  - {from: Chờ giám đốc duyệt, action: Duyệt, to: Đã duyệt, allowed: [TLC Director], allow_self_approval: true}
  - {from: Chờ giám đốc duyệt, action: Trả lại, to: Bổ sung thông tin, allowed: [TLC Director], allow_self_approval: true}
  - {from: Chờ giám đốc duyệt, action: Từ chối, to: Từ chối, allowed: [TLC Director], allow_self_approval: true}
  - {from: Đã duyệt, action: Nộp báo cáo, to: Chờ quản lý duyệt báo cáo, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: not doc.tlc_skip_manager}
  - {from: Đã duyệt, action: Nộp báo cáo giám đốc, to: Chờ giám đốc duyệt báo cáo, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: doc.tlc_skip_manager}
  - {from: Bổ sung báo cáo, action: Nộp báo cáo, to: Chờ quản lý duyệt báo cáo, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: not doc.tlc_skip_manager}
  - {from: Bổ sung báo cáo, action: Nộp báo cáo giám đốc, to: Chờ giám đốc duyệt báo cáo, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true, condition: doc.tlc_skip_manager}
  - {from: Chờ quản lý duyệt báo cáo, action: Duyệt báo cáo, to: Chờ giám đốc duyệt báo cáo, allowed: [TLC Line Manager], allow_self_approval: true}
  - {from: Chờ quản lý duyệt báo cáo, action: Trả lại báo cáo, to: Bổ sung báo cáo, allowed: [TLC Line Manager], allow_self_approval: true}
  - {from: Chờ giám đốc duyệt báo cáo, action: Duyệt báo cáo, to: Hoàn tất, allowed: [TLC Director], allow_self_approval: true}
  - {from: Chờ giám đốc duyệt báo cáo, action: Trả lại báo cáo, to: Bổ sung báo cáo, allowed: [TLC Director], allow_self_approval: true}
  - {from: Đã duyệt, action: Hủy chuyến, to: Đã hủy, allowed: [TLC Self Service, TLC Line Manager], allow_self_approval: true}
