version: 1
kind: permissions
description: |
  Who works on the payroll (HRMS gives it to HR Manager only): the payroll officer and the HR lead compute,
  the CEO reads and signs (posts the payslips), the accountant reads and confirms the payment.
permissions:
- {doctype: Payroll Entry, role: TLC Payroll, rights: rwcsx}
- {doctype: Payroll Entry, role: TLC HR Lead, rights: rwcsx}
- {doctype: Payroll Entry, role: TLC Director, rights: rws}  # s: Frappe checks submit for a workflow step of a submitted document
- {doctype: Payroll Entry, role: Accounts User, rights: rws}
- {doctype: Salary Slip, role: TLC Payroll, rights: rwcsx}
- {doctype: Salary Slip, role: TLC HR Lead, rights: rwcsx}
- {doctype: Salary Slip, role: TLC Director, rights: rws}
- {doctype: Salary Slip, role: Accounts User, rights: r}
- {doctype: Additional Salary, role: TLC Payroll, rights: rwcsx}
- {doctype: Additional Salary, role: TLC HR Lead, rights: rwcsx}
- {doctype: Salary Structure Assignment, role: TLC Payroll, rights: rwcs}
- {doctype: Salary Structure Assignment, role: TLC HR Lead, rights: rwcs}
