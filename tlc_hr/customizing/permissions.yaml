version: 1
kind: permissions
description: Rejection reasons remain readable by employees and writable by deciders; Employee salary amounts require an explicit payroll role at permlevel 1.
permissions:
- doctype: Leave Application
  role: Employee
  permlevel: 1
  rights: r
- doctype: Leave Application
  role: Leave Approver
  permlevel: 1
  rights: rw
- doctype: Leave Application
  role: TLC HR Lead
  permlevel: 1
  rights: rw
- doctype: Leave Application
  role: TLC HR Officer
  permlevel: 1
  rights: rw
- doctype: Leave Application
  role: TLC Director
  permlevel: 1
  rights: rw
- doctype: Leave Application
  role: HR Manager
  permlevel: 1
  rights: rw
- doctype: Leave Application
  role: HR User
  permlevel: 1
  rights: rw
- doctype: Attendance Request
  role: Employee
  permlevel: 1
  rights: r
- doctype: Attendance Request
  role: Leave Approver
  permlevel: 1
  rights: rw
- doctype: Attendance Request
  role: TLC HR Lead
  permlevel: 1
  rights: rw
- doctype: Attendance Request
  role: TLC HR Officer
  permlevel: 1
  rights: rw
- doctype: Attendance Request
  role: TLC Director
  permlevel: 1
  rights: rw
- doctype: Attendance Request
  role: HR Manager
  permlevel: 1
  rights: rw
- doctype: Attendance Request
  role: HR User
  permlevel: 1
  rights: rw
# Monetary Employee fields are moved to this level by employee_salary_visibility.yaml.
# HR User, HR Manager and Line Manager alone do not receive salary-field access.
- {doctype: Employee, role: TLC Payroll, permlevel: 1, rights: rw}
- {doctype: Employee, role: TLC HR Lead, permlevel: 1, rights: rw}
- {doctype: Employee, role: TLC Director, permlevel: 1, rights: r}
- {doctype: Employee, role: System Manager, permlevel: 1, rights: rw}